# Change these first
owner: ITClowd # Your GitHub username
repo: itclowd-uptime # Your GitHub repository name

# Add your sites here
sites:
  - name: Website
    url: https://itclowd.de
  - name: Nextcloud
    url: https://nextcloud.itclowd.de
    icon: https://nextcloud.com/c/uploads/2022/03/favicon.png
  - name: OnlyOffice Document Server
    url: https://onlyoffice.itclowd.de/healthcheck
  - name: Matrix Homeserver
    url: https://matrix.itclowd.de/_matrix/federation/v1/version
    icon: https://matrix.org/assets/favicon.ico
    method: GET
    headers:
      - "Content-Type: application/json"
    body: '{ "name": "Synapse" }'
  - name: Mealie
    url: https://mealie.itclowd.de
  - name: Stalwart Mail
    url: https://mail.itclowd.de
status-website:
  # Add your custom domain below, or remove the next line if you don't have a domain
  cname: status.itclowd.de
  # Uncomment the following line if you don't have a custom domain and add your repo name
  #baseUrl: /upptime
  logoUrl: https://raw.githubusercontent.com/upptime/upptime.js.org/master/static/img/icon.svg
  name: Upptime
  introTitle: "**Upptime** is the open-source uptime monitor and status page, powered entirely by GitHub."
  introMessage: Status of ITClowd
  navbar:
    - title: Status
      href: /
    - title: GitHub
      href: https://github.com/$OWNER/$REPO
  theme: dark
# Upptime also supports notifications, assigning issues, and more
# See https://upptime.js.org/docs/configuration
